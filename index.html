<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Count Along Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Canvas will be inserted here by Three.js -->
    </div>

    <div id="ui-overlay">
        <div id="count-display">Count: 0</div>
        <!-- Added Number Range Selection -->
        <div id="range-selection">
            <label for="min-count">Min:</label>
            <input type="number" id="min-count" value="1" min="1" max="10">
            <label for="max-count">Max:</label>
            <input type="number" id="max-count" value="10" min="1" max="20">
        </div>
        <!-- Removed Restart Button from top -->
        <!-- <button id="restart-button" class="hidden">Play Again</button> -->

        <div id="final-question" class="hidden">
            <p>How many did you count?</p>
            <!-- Moved Restart Button here -->
            <button id="restart-button" class="hidden">Play Again</button>
            <div id="answer-buttons">
                <!-- Buttons 1-10 will be added here -->
            </div>
            <div id="feedback" class="hidden"></div>
        </div>
    </div>

    <!-- Three.js Library (use CDN or local file) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Your Game Script -->
    <script src="script.js"></script>
</body>
</html>
